<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>About Me</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .card {
            background-color: #1e293b;
            padding: 40px;
            border-radius: 16px;
            text-align: center;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            max-width: 400px;
            width: 100%;
        }
        h1 { margin-bottom: 10px; font-size: 24px; }
        p { color: #94a3b8; font-size: 15px; margin-bottom: 30px; }
        .btn {
            display: block;
            background-color: #3b82f6;
            color: white;
            padding: 12px;
            margin: 10px 0;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 600;
            transition: background 0.2s;
        }
        .btn:hover { background-color: #2563eb; }
    </style>
</head>
<body>
    <div class="card">
        <h1>Hi, I'm Tanish 👋</h1>
        <p>Welcome to my personal corner of the internet. Find my socials and get in touch below!</p>
        
        <a href="https://instagram.com/YOUR_INSTAGRAM_HANDLE" class="btn" target="_blank">Instagram</a>
        <a href="mailto:YOUR_GMAIL@gmail.com" class="btn">Email Me</a>
    </div>
</body>
</html>
