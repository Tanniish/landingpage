<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tanish | Personal Landing Page</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: linear-gradient(135deg, #064e3b 0%, #022c22 100%);
            color: #ecfdf5;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .card {
            background-color: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(10px);
            padding: 40px;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0,0,0,0.4);
            border: 1px solid rgba(52, 211, 153, 0.2);
            max-width: 400px;
            width: 100%;
        }
        h1 { 
            margin-bottom: 10px; 
            font-size: 26px; 
            color: #34d399;
        }
        p { 
            color: #94a3b8; 
            font-size: 15px; 
            margin-bottom: 30px; 
            line-height: 1.5;
        }
        .btn {
            display: block;
            background: linear-gradient(135deg, #059669 0%, #047857 100%);
            color: white;
            padding: 14px;
            margin: 12px 0;
            border-radius: 10px;
            text-decoration: none;
            font-weight: 600;
            box-shadow: 0 4px 12px rgba(5, 150, 105, 0.3);
            transition: all 0.3s ease;
        }
        .btn:hover { 
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(16, 185, 129, 0.4);
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>Hi, I'm Tanish 👋</h1>
        <p>Welcome to my personal corner of the internet. Find my socials and get in touch below!</p>
        
        <a href="https://instagram.com/YOUR_INSTAGRAM_HANDLE" class="btn" target="_blank">Instagram</a>
        <a href="mailto:YOUR_GMAIL@gmail.com" class="btn">Email Me</a>
    </div>
</body>
</html>
